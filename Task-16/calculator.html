<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #e8edf5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator {
            width: 100%;
            max-width: 340px;
            background: #222831;
            padding: 22px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        h2 {
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }

        #display {
            width: 100%;
            height: 75px;
            background: #eeeeee;
            border: none;
            border-radius: 10px;
            margin-bottom: 18px;
            padding: 15px;
            text-align: right;
            font-size: 30px;
            color: #222;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 10px;
            font-size: 21px;
            font-weight: bold;
            cursor: pointer;
            background: #393e46;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            background: #505761;
            transform: scale(1.03);
        }

        .operator {
            background: #00adb5;
        }

        .operator:hover {
            background: #008c93;
        }

        .clear {
            background: #e74c3c;
        }

        .clear:hover {
            background: #c0392b;
        }

        .equal {
            background: #27ae60;
            grid-row: span 2;
            height: 130px;
        }

        .equal:hover {
            background: #219150;
        }

        .zero {
            grid-column: span 2;
        }

        #message {
            color: #ff7675;
            text-align: center;
            margin-top: 12px;
            min-height: 18px;
            font-size: 14px;
        }

        @media (max-width: 400px) {
            .calculator {
                padding: 15px;
            }

            button {
                height: 55px;
                font-size: 18px;
            }

            .equal {
                height: 120px;
            }

            #display {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h2>Simple Calculator</h2>

        <input type="text" id="display" value="0" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="backspace()">⌫</button>
            <button class="operator" onclick="chooseOperator('/')">÷</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>

            <button onclick="addNumber('7')">7</button>
            <button onclick="addNumber('8')">8</button>
            <button onclick="addNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <button onclick="addNumber('4')">4</button>
            <button onclick="addNumber('5')">5</button>
            <button onclick="addNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button onclick="addNumber('1')">1</button>
            <button onclick="addNumber('2')">2</button>
            <button onclick="addNumber('3')">3</button>
            <button class="equal" onclick="calculate()">=</button>

            <button class="zero" onclick="addNumber('0')">0</button>
            <button onclick="addDecimal()">.</button>

        </div>

        <p id="message"></p>

    </div>

    <script>
        let currentInput = "0";
        let previousInput = "";
        let operator = "";
        let shouldReset = false;

        const display = document.getElementById("display");
        const message = document.getElementById("message");

        function updateDisplay() {
            display.value = currentInput;
        }

        function addNumber(number) {
            message.textContent = "";

            if (currentInput === "Error" || shouldReset) {
                currentInput = number;
                shouldReset = false;
            } else if (currentInput === "0") {
                currentInput = number;
            } else {
                currentInput += number;
            }

            updateDisplay();
        }

        function addDecimal() {
            message.textContent = "";

            if (currentInput === "Error" || shouldReset) {
                currentInput = "0.";
                shouldReset = false;
            } else if (!currentInput.includes(".")) {
                currentInput += ".";
            }

            updateDisplay();
        }

        function chooseOperator(selectedOperator) {
            if (currentInput === "Error") return;

            if (operator !== "" && !shouldReset) {
                calculate();
            }

            previousInput = currentInput;
            operator = selectedOperator;
            shouldReset = true;
            message.textContent = "";
        }

        function calculate() {
            if (operator === "" || shouldReset) return;

            let firstNumber = parseFloat(previousInput);
            let secondNumber = parseFloat(currentInput);
            let result;

            switch (operator) {
                case "+":
                    result = firstNumber + secondNumber;
                    break;

                case "-":
                    result = firstNumber - secondNumber;
                    break;

                case "*":
                    result = firstNumber * secondNumber;
                    break;

                case "/":
                    if (secondNumber === 0) {
                        currentInput = "Error";
                        message.textContent = "Cannot divide by zero!";
                        updateDisplay();
                        operator = "";
                        previousInput = "";
                        shouldReset = true;
                        return;
                    }

                    result = firstNumber / secondNumber;
                    break;
            }

            currentInput = String(Number(result.toPrecision(12)));
            operator = "";
            previousInput = "";
            shouldReset = true;
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = "0";
            previousInput = "";
            operator = "";
            shouldReset = false;
            message.textContent = "";
            updateDisplay();
        }

        function backspace() {
            message.textContent = "";

            if (currentInput === "Error" || shouldReset) {
                currentInput = "0";
                shouldReset = false;
            } else {
                currentInput = currentInput.slice(0, -1);

                if (currentInput === "" || currentInput === "-") {
                    currentInput = "0";
                }
            }

            updateDisplay();
        }
    </script>

</body>
</html>
