<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
            text-align: center;
        }

        .profile {
            background-color: white;
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border: 2px solid blue;
        }

        h1 {
            color: blue;
        }

        p {
            font-size: 16px;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px;
            border: none;
        }
    </style>
</head>

<body>

    <div class="profile">

        <h1>Tushar Jethva</h1>

        <h3>About Me</h3>

        <p>Hello! I am a BSc Computer Science student.
        I like learning new technologies.</p>

        <h3>My Skills</h3>

        <p>HTML, CSS, Python, SQL</p>

        <button onclick="showMessage()">Click Me</button>

        <p id="message"></p>

    </div>

    <script>

        let name = "Tushar";

        function showMessage() {
            document.getElementById("message").innerHTML =
            "Hello " + name + "! Welcome to my Profile.";
        }

    </script>

</body>

</html>
