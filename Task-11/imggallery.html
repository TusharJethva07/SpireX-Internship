<!DOCTYPE html>
<html>
<head>
    <title>My Image Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
            text-align: center;
            padding: 30px 15px;
        }

        .container {
            background-color: white;
            max-width: 650px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            color: #333;
        }

        img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 12px;
            margin-top: 15px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            color: white;
            background-color: #007bff;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .dots {
            margin: 15px;
        }

        .dot {
            width: 12px;
            height: 12px;
            padding: 0;
            margin: 5px;
            border-radius: 50%;
            background-color: #bbb;
        }

        .dot.active {
            background-color: #007bff;
        }

        @media (max-width: 600px) {
            img {
                height: 230px;
            }

            button {
                padding: 10px 15px;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My Image Gallery</h1>

        <img id="galleryImage"
             src="https://picsum.photos/seed/nature1/800/500"
             alt="Gallery Image">

        <p id="caption">Beautiful Nature</p>

        <p id="imageNumber">Image 1 of 4</p>

        <button id="previous">Previous</button>
        <button id="next">Next</button>
        <button id="playPause">Play Slideshow</button>

        <div class="dots" id="dots"></div>

    </div>

    <script>
        let images = [
            {
                src: "https://picsum.photos/seed/nature1/800/500",
                caption: "Beautiful Nature"
            },
            {
                src: "https://picsum.photos/seed/mountain2/800/500",
                caption: "Beautiful Mountains"
            },
            {
                src: "https://picsum.photos/seed/forest3/800/500",
                caption: "Green Forest"
            },
            {
                src: "https://picsum.photos/seed/beach4/800/500",
                caption: "Beautiful Beach"
            }
        ];

        let currentImage = 0;
        let slideshow;

        let galleryImage = document.getElementById("galleryImage");
        let caption = document.getElementById("caption");
        let imageNumber = document.getElementById("imageNumber");
        let dots = document.getElementById("dots");
        let playPause = document.getElementById("playPause");

        function showImage() {
            galleryImage.src = images[currentImage].src;

            caption.innerText = images[currentImage].caption;

            imageNumber.innerText =
                "Image " + (currentImage + 1) + " of " + images.length;

            let allDots = document.querySelectorAll(".dot");

            allDots.forEach(function(dot, index) {
                dot.classList.toggle("active", index === currentImage);
            });
        }

        function nextImage() {
            currentImage++;

            if (currentImage >= images.length) {
                currentImage = 0;
            }

            showImage();
        }

        function previousImage() {
            currentImage--;

            if (currentImage < 0) {
                currentImage = images.length - 1;
            }

            showImage();
        }

        document.getElementById("next").addEventListener("click", function() {
            nextImage();
        });

        document.getElementById("previous").addEventListener("click", function() {
            previousImage();
        });

        // Create navigation dots
        images.forEach(function(image, index) {
            let dot = document.createElement("button");

            dot.className = "dot";
            dot.addEventListener("click", function() {
                currentImage = index;
                showImage();
            });

            dots.appendChild(dot);
        });

        // Play and Pause Slideshow
        playPause.addEventListener("click", function() {
            if (slideshow) {
                clearInterval(slideshow);
                slideshow = null;
                playPause.innerText = "Play Slideshow";
            }
            else {
                slideshow = setInterval(nextImage, 2000);
                playPause.innerText = "Pause Slideshow";
            }
        });

        // Display first image
        showImage();

    </script>

</body>
</html>
