<html>
<head>
    <title>Password Strength Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
            text-align: center;
            padding: 40px 15px;
        }

        .container {
            background-color: white;
            max-width: 450px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 12px gray;
        }

        h1 {
            color: #333;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 18px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            color: white;
            background-color: blue;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.8;
        }

        .reset {
            background-color: black;
        }

        .bar {
            width: 100%;
            height: 12px;
            background-color: #ddd;
            border-radius: 10px;
            margin-top: 15px;
            overflow: hidden;
        }

        #strengthBar {
            width: 0%;
            height: 100%;
            background-color: gray;
            transition: 0.4s;
        }

        #message {
            font-weight: bold;
            margin: 15px;
        }

        .requirements {
            text-align: left;
            margin: 20px 10px;
            line-height: 2;
        }

        .valid {
            color: green;
        }

        .invalid {
            color: red;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            button {
                width: 85%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Password Strength Checker</h1>

        <input type="password" id="password"
            placeholder="Enter your password">

        <br>

        <button id="showBtn">Show Password</button>

        <div class="bar">
            <div id="strengthBar"></div>
        </div>

        <p id="message">Enter a password</p>

        <div class="requirements">
            <p id="length">❌ At least 8 characters</p>
            <p id="upper">❌ One uppercase letter</p>
            <p id="lower">❌ One lowercase letter</p>
            <p id="number">❌ One number</p>
            <p id="special">❌ One special character</p>
        </div>

        <h3>Confirm Password</h3>

        <input type="password" id="confirm"
            placeholder="Confirm your password">

        <p id="matchMessage"></p>

        <button class="reset" id="resetBtn">Reset</button>

    </div>

    <script>

        let password = document.getElementById("password");
        let confirm = document.getElementById("confirm");

        let message = document.getElementById("message");
        let bar = document.getElementById("strengthBar");

        function checkPassword() {

            let value = password.value;
            let score = 0;

            if (value.length >= 8) {
                score++;
                document.getElementById("length").innerText =
                    "✔ At least 8 characters";
                document.getElementById("length").className = "valid";
            }
            else {
                document.getElementById("length").innerText =
                    "❌ At least 8 characters";
                document.getElementById("length").className = "invalid";
            }

            if (/[A-Z]/.test(value)) {
                score++;
                document.getElementById("upper").innerText =
                    "✔ One uppercase letter";
                document.getElementById("upper").className = "valid";
            }
            else {
                document.getElementById("upper").innerText =
                    "❌ One uppercase letter";
                document.getElementById("upper").className = "invalid";
            }

            if (/[a-z]/.test(value)) {
                score++;
                document.getElementById("lower").innerText =
                    "✔ One lowercase letter";
                document.getElementById("lower").className = "valid";
            }
            else {
                document.getElementById("lower").innerText =
                    "❌ One lowercase letter";
                document.getElementById("lower").className = "invalid";
            }

            if (/[0-9]/.test(value)) {
                score++;
                document.getElementById("number").innerText =
                    "✔ One number";
                document.getElementById("number").className = "valid";
            }
            else {
                document.getElementById("number").innerText =
                    "❌ One number";
                document.getElementById("number").className = "invalid";
            }

            if (/[^A-Za-z0-9]/.test(value)) {
                score++;
                document.getElementById("special").innerText =
                    "✔ One special character";
                document.getElementById("special").className = "valid";
            }
            else {
                document.getElementById("special").innerText =
                    "❌ One special character";
                document.getElementById("special").className = "invalid";
            }

            if (value === "") {
                message.innerText = "Please enter a password";
                bar.style.width = "0%";
                bar.style.backgroundColor = "gray";
            }
            else if (score <= 2) {
                message.innerText = "Weak Password";
                message.style.color = "red";
                bar.style.width = "33%";
                bar.style.backgroundColor = "red";
            }
            else if (score <= 4) {
                message.innerText = "Medium Password";
                message.style.color = "orange";
                bar.style.width = "66%";
                bar.style.backgroundColor = "orange";
            }
            else {
                message.innerText = "Strong Password";
                message.style.color = "green";
                bar.style.width = "100%";
                bar.style.backgroundColor = "green";
            }

            checkMatch();
        }

        function checkMatch() {

            let matchMessage = document.getElementById("matchMessage");

            if (confirm.value === "") {
                matchMessage.innerText = "";
            }
            else if (password.value === confirm.value) {
                matchMessage.innerText = "✔ Passwords Match";
                matchMessage.style.color = "green";
            }
            else {
                matchMessage.innerText = "❌ Passwords Do Not Match";
                matchMessage.style.color = "red";
            }
        }

        password.addEventListener("input", checkPassword);

        confirm.addEventListener("input", checkMatch);

        document.getElementById("showBtn").addEventListener("click", function() {

            if (password.type === "password") {
                password.type = "text";
                confirm.type = "text";
                this.innerText = "Hide Password";
            }
            else {
                password.type = "password";
                confirm.type = "password";
                this.innerText = "Show Password";
            }

        });

        document.getElementById("resetBtn").addEventListener("click", function() {

            password.value = "";
            confirm.value = "";

            document.getElementById("showBtn").innerText = "Show Password";

            checkPassword();
            checkMatch();

        });

        checkPassword();

    </script>

</body>
</html>
