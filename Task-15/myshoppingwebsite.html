<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #333;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #333;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        .cart-info {
            background: #fff;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .search-box {
            text-align: center;
            padding: 20px;
        }

        .search-box input {
            width: 80%;
            max-width: 400px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        h2 {
            text-align: center;
            margin: 20px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1100px;
            margin: auto;
        }

        .product {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product h3 {
            margin: 12px 0;
        }

        .price {
            color: #087a36;
            font-size: 18px;
            font-weight: bold;
            margin: 10px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            opacity: 0.85;
        }

        .remove-btn {
            background: #dc3545;
        }

        .cart-section {
            background: white;
            max-width: 700px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .cart-total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            nav a {
                display: inline-block;
                margin: 6px;
            }

            .cart-item {
                flex-wrap: wrap;
            }

            .cart-section {
                margin: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Shopping Website</h1>
        <p>Welcome to our online store!</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#cart">Cart</a>
    </nav>

    <div class="cart-info">
        🛒 Cart Items: <span id="cartCount">0</span>
    </div>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
            oninput="searchProducts()"
        >
    </div>

    <h2 id="products">Our Products</h2>

    <div class="products" id="productList">

        <div class="product" data-name="headphones">
            <img
                src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
                alt="Headphones"
            >
            <h3>Headphones</h3>
            <p class="price">₹999</p>
            <button onclick="addToCart('Headphones', 999)">
                Add to Cart
            </button>
        </div>

        <div class="product" data-name="smart watch">
            <img
                src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
                alt="Smart Watch"
            >
            <h3>Smart Watch</h3>
            <p class="price">₹1499</p>
            <button onclick="addToCart('Smart Watch', 1499)">
                Add to Cart
            </button>
        </div>

        <div class="product" data-name="shoes">
            <img
                src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
                alt="Shoes"
            >
            <h3>Shoes</h3>
            <p class="price">₹1999</p>
            <button onclick="addToCart('Shoes', 1999)">
                Add to Cart
            </button>
        </div>

        <div class="product" data-name="backpack">
            <img
                src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500"
                alt="Backpack"
            >
            <h3>Backpack</h3>
            <p class="price">₹799</p>
            <button onclick="addToCart('Backpack', 799)">
                Add to Cart
            </button>
        </div>

    </div>

    <section class="cart-section" id="cart">
        <h2>Shopping Cart</h2>

        <div id="cartItems">
            <p>Your cart is empty.</p>
        </div>

        <div class="cart-total">
            Total: ₹<span id="totalPrice">0</span>
        </div>
    </section>

    <footer>
        <p>© 2026 My Shopping Website | All Rights Reserved</p>
    </footer>

    <script>
        let cart = [];

        function addToCart(name, price) {
            let existingItem = cart.find(item => item.name === name);

            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({
                    name: name,
                    price: price,
                    quantity: 1
                });
            }

            updateCart();
        }

        function removeFromCart(name) {
            let existingItem = cart.find(item => item.name === name);

            if (existingItem) {
                existingItem.quantity--;

                if (existingItem.quantity === 0) {
                    cart = cart.filter(item => item.name !== name);
                }
            }

            updateCart();
        }

        function updateCart() {
            let cartItems = document.getElementById("cartItems");
            let cartCount = document.getElementById("cartCount");
            let totalPrice = document.getElementById("totalPrice");

            let count = 0;
            let total = 0;

            cartItems.innerHTML = "";

            if (cart.length === 0) {
                cartItems.innerHTML = "<p>Your cart is empty.</p>";
            }

            cart.forEach(item => {
                count += item.quantity;
                total += item.price * item.quantity;

                cartItems.innerHTML += `
                    <div class="cart-item">
                        <span>
                            ${item.name} × ${item.quantity}
                            — ₹${item.price * item.quantity}
                        </span>

                        <button class="remove-btn"
                            onclick="removeFromCart('${item.name}')">
                            Remove
                        </button>
                    </div>
                `;
            });

            cartCount.textContent = count;
            totalPrice.textContent = total;
        }

        function searchProducts() {
            let searchValue = document
                .getElementById("searchInput")
                .value.toLowerCase();

            let products = document.querySelectorAll(".product");

            products.forEach(product => {
                let name = product.getAttribute("data-name");

                if (name.includes(searchValue)) {
                    product.style.display = "block";
                } else {
                    product.style.display = "none";
                }
            });
        }
    </script>

</body>
</html>
