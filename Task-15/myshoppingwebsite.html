<html>
<head>
    <title>My Shopping Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f4f8;
        }

        header {
            background-color: #172b4d;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #263f66;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-size: 17px;
        }

        .cart {
            color: yellow;
            font-weight: bold;
        }

        .search {
            text-align: center;
            margin: 25px;
        }

        input {
            width: 70%;
            max-width: 400px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .product {
            background-color: white;
            padding: 15px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 0 8px #ccc;
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product h3 {
            color: #333;
        }

        .price {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        .remove {
            background-color: red;
        }

        .cart-section {
            background-color: white;
            margin: 20px;
            padding: 20px;
            border-radius: 12px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #ddd;
            padding: 12px 0;
        }

        .total {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }

        footer {
            background-color: #172b4d;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }

        @media (max-width: 800px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .products {
                grid-template-columns: 1fr;
            }

            nav a {
                display: inline-block;
                margin: 8px;
            }

            .cart-item {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Shopping Website</h1>
        <p>Shop Your Favourite Products</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#products">Products</a>
        <a href="#myCart">My Cart</a>
        <span class="cart">
            Cart Items: <span id="cartCount">0</span>
        </span>
    </nav>

    <div class="search">
        <input type="text" id="searchInput"
            placeholder="Search products...">
    </div>

    <h2 style="text-align:center;">Our Products</h2>

    <div class="products" id="productList">

        <div class="product">
            <img src="https://picsum.photos/seed/headphones/400/300"
                alt="Headphones">
            <h3>Headphones</h3>
            <p class="price">₹999</p>
            <button onclick="addToCart('Headphones', 999)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <img src="https://picsum.photos/seed/watch/400/300"
                alt="Smart Watch">
            <h3>Smart Watch</h3>
            <p class="price">₹1499</p>
            <button onclick="addToCart('Smart Watch', 1499)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <img src="https://picsum.photos/seed/shoes/400/300"
                alt="Shoes">
            <h3>Shoes</h3>
            <p class="price">₹1999</p>
            <button onclick="addToCart('Shoes', 1999)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <img src="https://picsum.photos/seed/bag/400/300"
                alt="Backpack">
            <h3>Backpack</h3>
            <p class="price">₹799</p>
            <button onclick="addToCart('Backpack', 799)">
                Add to Cart
            </button>
        </div>

    </div>

    <div class="cart-section" id="myCart">

        <h2>🛒 My Shopping Cart</h2>

        <div id="cartItems">
            Your cart is empty.
        </div>

        <h3 class="total">
            Total Price: ₹<span id="totalPrice">0</span>
        </h3>

    </div>

    <footer>
        <p>© 2026 My Shopping Website</p>
    </footer>

    <script>

        let cart = [];

        function addToCart(name, price) {

            let item = cart.find(function(product) {
                return product.name === name;
            });

            if (item) {
                item.quantity++;
            }
            else {
                cart.push({
                    name: name,
                    price: price,
                    quantity: 1
                });
            }

            updateCart();
        }

        function removeFromCart(name) {

            let item = cart.find(function(product) {
                return product.name === name;
            });

            if (item) {
                item.quantity--;

                if (item.quantity === 0) {
                    cart = cart.filter(function(product) {
                        return product.name !== name;
                    });
                }
            }

            updateCart();
        }

        function updateCart() {

            let cartItems = document.getElementById("cartItems");

            let count = 0;
            let total = 0;

            cartItems.innerHTML = "";

            if (cart.length === 0) {
                cartItems.innerHTML = "Your cart is empty.";
            }

            cart.forEach(function(item) {

                count = count + item.quantity;
                total = total + (item.price * item.quantity);

                let div = document.createElement("div");

                div.className = "cart-item";

                div.innerHTML = `
                    <span>
                        ${item.name} - ₹${item.price}
                        × ${item.quantity}
                    </span>

                    <button class="remove"
                        onclick="removeFromCart('${item.name}')">
                        Remove
                    </button>
                `;

                cartItems.appendChild(div);

            });

            document.getElementById("cartCount").innerText = count;

            document.getElementById("totalPrice").innerText = total;

        }

        // Search Products

        document.getElementById("searchInput")
            .addEventListener("input", function() {

                let searchValue = this.value.toLowerCase();

                let products = document.querySelectorAll(".product");

                products.forEach(function(product) {

                    let name = product.querySelector("h3").innerText.toLowerCase();

                    if (name.includes(searchValue)) {
                        product.style.display = "block";
                    }
                    else {
                        product.style.display = "none";
                    }

                });

            });

    </script>

</body>
</html>
